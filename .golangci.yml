version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - cyclop
    - unparam
    - goconst
    - gosec
    - prealloc
    - nilerr
    - errorlint
    - revive
  settings:
    cyclop:
      max-complexity: 50
    goconst:
      min-len: 4
      min-occurrences: 4
      ignore-string-values:
        - "true"
        - "false"
        - "string"
        - "integer"
        - "number"
        - "boolean"
        - "object"
        - "array"
        - "body"
        - "path"
        - "query"
        - "header"
    gosec:
      excludes:
        - G104  # Unhandled errors - too noisy for this codebase
        - G501  # Blocklisted import - not relevant here
    revive:
      rules:
        - name: exported
          disabled: true  # Too noisy for stable APIs
  exclusions:
    rules:
      # Exclude gosec warnings in test files
      - path: _test\.go
        linters:
          - gosec
      # Allow string literals in test files
      - path: _test\.go
        linters:
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 20
